<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClearHR</title><style>body{max-width:900px;margin:2rem auto;font:16px system-ui;background:#f6f8fb;color:#13233a}textarea,input,button{font:inherit;padding:.7rem;border-radius:7px;border:1px solid #bcc7d6}textarea{width:100%;box-sizing:border-box}button{background:#1268d6;color:white;border:0;cursor:pointer}main{background:white;padding:2rem;border-radius:12px;box-shadow:0 2px 14px #dce2ea}pre{white-space:pre-wrap;background:#f2f5f8;padding:1rem;border-radius:7px}.row{display:flex;gap:.5rem;margin:.7rem 0}</style></head><body><main><h1>ClearHR</h1><p>Grounded policy guidance using synthetic data only.</p><textarea id="message" rows="5">Can I take three days of PTO next week?</textarea><div class="row"><input id="employee" value="E1001" aria-label="Employee ID"><button onclick="ask()">Ask ClearHR</button></div><p>Try: PTO guidance (E1001), remote work from another country, or a benefits question.</p><pre id="response">Ready.</pre></main><script>async function ask(){let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:message.value,employee_id:employee.value||null})});response.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
